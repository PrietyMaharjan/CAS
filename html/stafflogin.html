<html lang="en">
<head>

    <title>CAS Login</title>
    <link rel="stylesheet" href="../css/stafflogin.css">
    <link rel="icon" type="image/x-icon" href="images/CAS.gif">

<body>

        <div class="left">
            <h2>Login</h2>
            <p>Welcome My Colleague</p>

            <form>
    </div>
