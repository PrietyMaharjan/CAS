    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CAS Dashboard</title>
        <link rel="stylesheet" href="../css/dashboard.css">
        <link rel="icon" type="image/x-icon" href="images/CAS.gif">
    </head>
    <body>
        <div class="navbar">
            <span class="menu-icon">&#9776</span>
            <span class="title">CAS</span>
            <span class="notification-icon">🔔</span>
        </div>
        
        <div class="main-content">
            <div class="header-images">
                <img src="../images/Earthquake.png" alt="2015 Earthquake">
                <button class="emergency-btn">Emergency | SOS</button>
                <img src="../images/Flood2.png" alt="2024 Flood">
            </div>
            <div class="cards">
                <div class="card">
                    <h3>Contacts</h3> 
                    <span class="firetruck">🚒</span>
                    <p>Fire Rescue</p>
                    <span class="firetruck">🏥</span>
                    <p>Hospital</p>
                    <span class="firetruck">🛡️</span>
                    <p>Police Station</p>
                </div>
                <div class="card">
                    <h3>Services</h3>
                    <span class="firetruck">🛡️</span>
                    <p>Crime Report</p>
                    <span class="firetruck">🦒</span>
                    <p>Wildlife Conservation</p>
                    <span class="firetruck">⚠️</span>
                    <p>Hazard Alert</p>
                </div>
                <div class="card">
                    <h3>Information</h3>
                    <span class="firetruck">✅ </span>
                    <p>Safety Tips</p>
                    <span class="firetruck">➕</span>
                    <p>First Aid Tips</p>
                    <span class="firetruck">🚨</span>
                    <p>Emergency Preparedness</p>
                </div>
            </div>
        </div>
    </body>
    </html>
