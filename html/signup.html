<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="icon" type="image/x-icon" href="/images/CAS.gif">
</head>
<body>
    <div class="container">
        <div class="left">
            <a href="loginpage.html" class="back-arrow">←</a>
            <p>Welcome to Community Alert System,<br>We're glad you are here</p>
            <p>Already have an account? <a href="loginpage.html" class="login-link">Login</a></p>
            <p class="terms">By signing up, you agree to the CAS terms & conditions</p>
        </div>
        <div class="right">
            <form action="loginpage.html" method="get">
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
                <input type="tel" placeholder="Mobile Number" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
