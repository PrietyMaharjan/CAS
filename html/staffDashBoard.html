<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="../css/staffDashboard.css">
    <link rel="icon" type="image/x-icon" href="/images/CAS.gif">
</head>
<body>
    <div class="header">
        <div class="menu">☰</div>
        Staff Dashboard
        <div class="notification">🔔</div>
    </div>
    <div class="alert-box" >
        ⚠️ Important alert message here!
        <input type="text" class="input-field" placeholder="Enter alert message...">
        <button class="enter">Enter</button>
    </div>
    
    <div class="container">
        <div class="section">
            <h3>Disaster Information</h3>
            <input type="text" class="input-field" placeholder="Enter disaster info...">
                        <input type="file" id="photo-upload" accept="image/*" class="file-input"> 
            <div class="buttons">
                <button class="add">Add</button>
                <button class="delete">Delete</button>
                <button class="update">Update</button>
            </div>
        </div>

        <div class="section">
            <h3>User Base</h3>
            <input type="text" class="input-field" placeholder="First Name...">
            <input type="text" class="input-field" placeholder="Last Name...">
            <input type="text" class="input-field" placeholder="Mobile Number...">
            <input type="text" class="input-field" placeholder="Email...">
            <input type="text" class="input-field" placeholder="Password...">
            <div class="buttons">
                <button class="add">Add</button>
                <button class="delete">Delete</button>
                <button class="update">Update</button>
            </div>
        </div>
        <div class="section">
            <h3>Latest News</h3>
            <input type="text" class="input-field" placeholder="Latest news...">    
            <input type="file" id="photo-upload" accept="image/*" class="file-input"> 
            <div class="buttons">
                <button class="add">Add</button>
                <button class="delete">Delete</button>
                <button class="update">Update</button>
            </div>
        </div>
        
    </div>
</body>
</html>
